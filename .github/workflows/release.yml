name: Release FaradAiWire

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            binary_name: faradaiwire
          - os: darwin
            arch: amd64
            runner: macos-latest
            binary_name: faradaiwire
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: faradaiwire
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary_name: faradaiwire
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: faradaiwire.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Information
        shell: bash
        env:
          RAW_INPUT_VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RAW_VER="${RAW_INPUT_VER}"
          case "$RAW_VER" in
            *$'\n'*|*$'\r'*)
              echo "Invalid release version: contains newline" >&2
              exit 1
              ;;
          esac
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ] || [ "$RAW_VER" = "master" ]; then
            RAW_VER="v1.0.0"
          fi
          if [[ ! "$RAW_VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version format: $RAW_VER" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RAW_VER}" >> "$GITHUB_ENV"
          CLEAN_VER="${RAW_VER#v}"
          echo "CLEAN_VERSION=${CLEAN_VER}" >> "$GITHUB_ENV"

      - name: Setup Node.js (Web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Console Assets
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Setup Go 1.23+
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Configure macOS Build Environment
        if: matrix.os == 'darwin'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "CC=clang -arch x86_64" >> $GITHUB_ENV
            echo "GOARCH=amd64" >> $GITHUB_ENV
          fi

      - name: Compile Native Binary with CGO
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w -X main.version=$RELEASE_VERSION" -o dist/${{ matrix.binary_name }} ./cmd/faradaiwire

      - name: Package Unix Archive (.tar.gz)
        if: matrix.os != 'windows'
        run: |
          cd dist
          tar -czvf "faradaiwire_${CLEAN_VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "${{ matrix.binary_name }}"

      - name: Package Windows Archive (.zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $CleanVersion = $env:CLEAN_VERSION
          cd dist
          Compress-Archive -Path "${{ matrix.binary_name }}" -DestinationPath "faradaiwire_${CleanVersion}_windows_amd64.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faradaiwire-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/faradaiwire_*.*

  release:
    name: Publish Release & Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        id: release_meta
        shell: bash
        env:
          RAW_INPUT_VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          RAW_VER="${RAW_INPUT_VER}"
          case "$RAW_VER" in
            *$'\n'*|*$'\r'*)
              echo "Invalid release version: contains newline" >&2
              exit 1
              ;;
          esac
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ] || [ "$RAW_VER" = "master" ]; then
            RAW_VER="v1.0.0"
          fi
          if [[ ! "$RAW_VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version format: $RAW_VER" >&2
            exit 1
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Generate Cryptographic SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum faradaiwire_* > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Render Homebrew Formula & Cask
        env:
          RAW_VER: ${{ steps.release_meta.outputs.version }}
        run: |
          CLEAN_VER="${RAW_VER#v}"

          cd release_assets
          ARM64_SHA=$(grep '_darwin_arm64\.tar\.gz$' checksums.txt | awk '{print $1}')
          AMD64_SHA=$(grep '_darwin_amd64\.tar\.gz$' checksums.txt | awk '{print $1}')
          LINUX_SHA=$(grep '_linux_amd64\.tar\.gz$' checksums.txt | awk '{print $1}')
          LINUX_ARM64_SHA=$(grep '_linux_arm64\.tar\.gz$' checksums.txt | awk '{print $1}')

          if [ -f ../deploy/homebrew/faradaiwire.rb.tmpl ]; then
            sed -e "s/{{VERSION}}/${CLEAN_VER}/g" \
                -e "s/{{DARWIN_ARM64_SHA}}/${ARM64_SHA}/g" \
                -e "s/{{DARWIN_AMD64_SHA}}/${AMD64_SHA}/g" \
                -e "s/{{LINUX_AMD64_SHA}}/${LINUX_SHA}/g" \
                -e "s/{{LINUX_ARM64_SHA}}/${LINUX_ARM64_SHA}/g" \
                ../deploy/homebrew/faradaiwire.rb.tmpl > faradaiwire.rb
            echo "Generated Homebrew Formula:"
            cat faradaiwire.rb
          fi

          if [ -f ../deploy/homebrew/Casks/faradaiwire.rb.tmpl ]; then
            sed -e "s/{{VERSION}}/${CLEAN_VER}/g" \
                -e "s/{{DARWIN_ARM64_SHA}}/${ARM64_SHA}/g" \
                -e "s/{{DARWIN_AMD64_SHA}}/${AMD64_SHA}/g" \
                ../deploy/homebrew/Casks/faradaiwire.rb.tmpl > faradaiwire-cask.rb
            echo "Generated Homebrew Cask:"
            cat faradaiwire-cask.rb
          fi
          cd ..

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: FaradAiWire ${{ steps.release_meta.outputs.version }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.version }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "⚠️ HOMEBREW_TAP_TOKEN secret is not set. Skipping automatic push to FaradAiLab/homebrew-tap."
            echo "To enable automatic updates, add HOMEBREW_TAP_TOKEN (PAT with repo write permissions) to repository secrets."
            exit 0
          fi

          echo "🚀 Updating FaradAiLab/homebrew-tap repository..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/FaradAiLab/homebrew-tap.git tap_repo

          if [ -f release_assets/faradaiwire.rb ]; then
            mkdir -p tap_repo/Formula
            cp release_assets/faradaiwire.rb tap_repo/Formula/faradaiwire.rb
            git -C tap_repo add Formula/faradaiwire.rb
          fi

          if [ -f release_assets/faradaiwire-cask.rb ]; then
            mkdir -p tap_repo/Casks
            cp release_assets/faradaiwire-cask.rb tap_repo/Casks/faradaiwire.rb
            git -C tap_repo add Casks/faradaiwire.rb
          fi

          cd tap_repo
          if git diff --staged --quiet; then
            echo "Formula & Cask are already up to date."
          else
            git commit -m "feat(formula): bump faradaiwire to ${RELEASE_TAG}"
            git push origin main
            echo "🎉 Successfully published formula to FaradAiLab/homebrew-tap!"
          fi
