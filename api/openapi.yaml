openapi: 3.1.0
info:
  title: FaradAiWire Open Core Security API
  version: 0.3.0
  description: >
    Zero-Trust AI Agent Security Gateway Policy Enforcement Point (PEP) REST & SSE API.
    Provides administrative controls, security telemetry queries, agent manifest management,
    API key rotation, and real-time MCP streaming inspection.
servers:
  - url: http://127.0.0.1:19415
    description: Local Administrative Console (admin_port)
  - url: http://127.0.0.1:19410
    description: Agent Ingress Proxy (listen_port)

paths:
  # ============================================================================
  # Admin Console Endpoints (Port 19415)
  # ============================================================================
  /admin/dashboard:
    get:
      summary: Embedded Administrative Dashboard Web Console
      description: Returns the single-page HTML/JS administrative application embedded directly inside the gateway binary.
      responses:
        '200':
          description: Embedded HTML dashboard
          content:
            text/html:
              schema: { type: string }

  /admin/status:
    get:
      summary: Gateway Health & Operational Status
      description: Returns process runtime statistics, goroutines, active filters, and registered agent count.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Operational health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatusResponse'
        '401':
          description: Unauthorized

  /admin/settings:
    get:
      summary: Retrieve Active Gateway Settings
      description: Returns self-describing operational settings metadata (including timeouts.probe_timeout_sec), active values, categories, and override flags.
      responses:
        '200':
          description: Active gateway settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  categories:
                    type: array
                    items: { type: string }
                    example: ["guard", "limits", "maintenance", "timeouts"]
                  settings: { type: array, items: { type: object } }
    post:
      summary: Update Operational Gateway Settings
      description: Validates and persists operational setting overrides to the DuckDB system_settings sparse overlay without modifying config.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, example: "guard.threshold_score" }
                value: {}
                settings: { type: object }
      responses:
        '200':
          description: Settings updated successfully
        '400':
          description: Validation failed or invalid payload
        '500':
          description: Failed to persist setting to DuckDB or reload runtime config
    put:
      summary: Update Operational Gateway Settings (PUT)
      description: Equivalent to POST /admin/settings; validates and persists operational setting overrides without modifying config.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, example: "timeouts.probe_timeout_sec" }
                value: {}
                settings: { type: object }
      responses:
        '200':
          description: Settings updated successfully
        '400':
          description: Validation failed or invalid payload
        '500':
          description: Failed to persist setting to DuckDB or reload runtime config

  /admin/settings/reset:
    post:
      summary: Reset Setting or Filter Override to Baseline Default
      description: Deletes a DuckDB system_settings override (including "filters.<name>" keys) and restores the baseline config.yaml value in memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  example: "filters.dlp"
      responses:
        '200':
          description: Setting reset to baseline default successfully
        '400':
          description: Unknown or missing setting key
        '500':
          description: Failed to delete override from DuckDB

  /admin/config/toggle:
    post:
      summary: Runtime Toggle for Security Filters
      description: >
        Persists a security filter toggle ("filters.<name>") to the DuckDB system_settings sparse overlay
        and atomically swaps the in-memory filter pipeline without modifying config.yaml on disk (ADR-0053 / ADR-0054).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              anyOf:
                - required: [filter]
                - required: [filter_name]
              properties:
                filter:
                  type: string
                  enum: [prefill_block, dlp, rate_limiting, loop_protection, guard, hitl, schema_validation]
                  example: "dlp"
                filter_name:
                  type: string
                  enum: [prefill_block, dlp, rate_limiting, loop_protection, guard, hitl, schema_validation]
                  example: "dlp"
                enabled: { type: boolean }
      responses:
        '200':
          description: Filter setting persisted and reloaded in memory successfully
        '400':
          description: Invalid request body or unknown filter name
        '500':
          description: Failed to persist filter toggle to DuckDB or reload runtime pipeline (fail-closed)

  /admin/schemas/clear:
    post:
      summary: Clear Dynamic Tool Schema Baselines
      description: Clears first-seen tool schema baselines to allow new schema definitions without triggering drift alerts.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Baselines cleared successfully

  /admin/audit-logs:
    get:
      summary: Query Historical Audit Logs
      description: Queries consolidated four-field invocation audit records stored in local DuckDB or fallback JSONL audit trail.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: decision
          in: query
          schema: { type: string, enum: [PENDING, ALLOWED, AUDIT, MASKED, ERROR, BLOCKED, CRITICAL] }
        - name: agent_name
          in: query
          schema: { type: string }
        - name: tool_name
          in: query
          schema: { type: string }
        - name: trace_id
          in: query
          schema: { type: string }
        - name: summary
          in: query
          description: Set to "1" to omit heavy four-field payload blobs from list responses.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        '200':
          description: Audit logs query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'

  /admin/audit-logs/{id}:
    get:
      summary: Get Single Audit Invocation Record
      description: Returns a complete consolidated Tool Invocation Record including all four sparse lifecycle snapshots (original_request, request, original_response, response).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Complete invocation record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  record:
                    $ref: '#/components/schemas/AuditRecord'
        '400':
          description: Missing record identifier
        '404':
          description: Audit record not found
        '500':
          description: Internal storage error

  /admin/audit-logs/events:
    get:
      summary: Live Audit Events Stream (Admin Alias SSE)
      description: Real-time Server-Sent Events stream delivering lightweight debounced audit summaries to Admin Console subscribers.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/logs/events:
    get:
      summary: Live Audit Events Stream (SSE)
      description: Real-time Server-Sent Events stream delivering live blocking, masking, and inspection events to dashboard subscribers.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema: { type: string }

  /admin/mcp/tools:
    get:
      summary: List Registered MCP Tools
      description: Returns tool manifests discovered across all registered agent domains.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of registered MCP tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MCPTool'

  /admin/agents:
    get:
      summary: List Configured Agents
      description: Returns summary and masked configurations of all local agent profiles.
      responses:
        '200':
          description: List of agent configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentSummary'
    post:
      summary: Create Agent Security Profile
      description: Creates a new agent profile with protocol bindings, tool governance, rate limiting, loop protection, schema validation, and guard enforcement overrides.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPayload'
      responses:
        '201':
          description: Agent profile created
        '400':
          description: Validation error (INVALID_IDENTIFIER, INVALID_GOVERNANCE_MODE, INVALID_RETAINED_GOVERNANCE_MODE, INVALID_RATE_LIMIT, INVALID_LOOP_PROTECTION, INVALID_SCHEMA_VALIDATION, INVALID_GUARD_OVERRIDE)
        '409':
          description: Agent already exists (AGENT_ALREADY_EXISTS)

  /admin/agents/{name}:
    get:
      summary: Get Single Agent Profile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSummary'
        '404':
          description: Agent not found
    put:
      summary: Update Agent Security Profile
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPayload'
      responses:
        '200':
          description: Agent profile updated with snapshot archived
        '400':
          description: Validation error
        '404':
          description: Agent not found
    delete:
      summary: Delete Agent Security Profile
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent deleted
        '409':
          description: Agent has active sessions (AGENT_IN_USE)

  /admin/agents/sync-tools:
    post:
      summary: Probe and Sync Agent Tools
      description: Probes upstream MCP servers defined for the agent and caches tool manifests locally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_name]
              properties:
                agent_name: { type: string, example: "default" }
      responses:
        '200':
          description: Tools synchronized successfully

  /admin/api-keys:
    get:
      summary: List API Keys
      description: Returns metadata of all active API keys (hashes only; plaintext secrets are never stored or returned).
      responses:
        '200':
          description: List of registered API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeySummaryResponse'
    post:
      summary: Create New API Key
      description: Generates a new API key with the specified role, returning the plaintext secret exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, example: "ci-agent" }
                role: { type: string, enum: [Admin, Agent, Viewer], default: Agent }
      responses:
        '201':
          description: Key generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyResponse'

  /admin/api-keys/{id}:
    delete:
      summary: Revoke API Key
      description: Immediately revokes and deletes the specified API key.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: API key revoked successfully
        '404':
          description: API key not found

  # ============================================================================
  # Agent Snapshots & Rollback Endpoints (Port 19415)
  # ============================================================================
  /admin/agents/archives:
    get:
      summary: List Agent Snapshots
      description: Returns historical configuration snapshots for the specified agent.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: agent
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of snapshot timestamps
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { type: string }
                  archives: { type: array, items: { type: string } }
        '400':
          description: Missing or invalid agent identifier

  /admin/agents/rollback:
    post:
      summary: Rollback Agent Configuration
      description: Restores a previous configuration snapshot for an agent and hot-reloads the gateway.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, timestamp]
              properties:
                agent: { type: string, example: "finance-agent" }
                timestamp: { type: string, example: "20261031T120000Z" }
      responses:
        '200':
          description: Agent rolled back successfully
        '404':
          description: Archive snapshot not found

  # ============================================================================
  # AI Guard Management Endpoints (Port 19415)
  # ============================================================================
  /admin/guards/probe:
    get:
      summary: Probe AI Guard Inference Providers
      description: Probes configured or locally available AI Guard inference backends (Ollama, Docker FaradAiGuard, or custom URL) and redacts embedded URL credentials.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: url
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: AI Guard probe result
        '400':
          description: Invalid or disallowed probe target URL
    post:
      summary: Probe AI Guard Inference Providers (POST)
      description: Probes a target AI Guard URL passed in the JSON request body (`{"url": "..."}`) or the currently configured endpoint.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: AI Guard probe result
        '400':
          description: Invalid or disallowed probe target URL

  /admin/guards/configure:
    post:
      summary: Configure AI Guard Discovery & Endpoint
      description: Updates AI Guard discovery settings (`mode`, `ollama_url`, `docker_url`, `custom_url`, `enabled`) in DuckDB system_settings and atomically reloads the gateway configuration without modifying config.yaml.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, example: true }
                mode: { type: string, enum: [auto, ollama, docker, custom], example: "auto" }
                ollama_url: { type: string, example: "http://127.0.0.1:11434" }
                docker_url: { type: string, example: "http://127.0.0.1:8088" }
                custom_url: { type: string, example: "http://127.0.0.1:11434" }
      responses:
        '200':
          description: AI Guard configuration updated
        '400':
          description: Invalid request body or disallowed URL

  /admin/guards/status:
    get:
      summary: AI Guard Subprocess Status
      description: Reports the runtime status, PID, and health of the active AI Guard model.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Guard process runtime status
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  health_status: { type: string, enum: [HEALTHY, DEGRADED, STOPPED] }
                  model_id: { type: string }
                  pid: { type: integer }

  /admin/guards/models:
    get:
      summary: List AI Guard Models Catalog
      description: Lists all available and installed AI Guard models for deep-path inspection.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of catalog models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        install_status: { type: string }
                        is_active: { type: boolean }

  /admin/guards/models/{id}/connect:
    post:
      summary: Connect External Guard Endpoint
      description: Verifies and binds an external Ollama, Docker, or vLLM inference endpoint as the active guard.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint_url]
              properties:
                endpoint_url: { type: string, example: "http://localhost:11434" }
                runtime_type: { type: string, enum: [ollama, docker, vllm], default: docker }
                context_window: { type: integer, default: 2048 }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Connected and activated successfully
        '503':
          description: Target endpoint probe failed

  /admin/guards/models/{id}/activate:
    post:
      summary: Activate Installed Guard Model
      description: Zero-downtime hot-swap and process activation for an installed guard model.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Model activated successfully
        '400':
          description: Model not installed

  /admin/guards/models/deactivate:
    post:
      summary: Deactivate Guard (Switch to L1-Only Mode)
      description: Gracefully stops the active guard model and switches the gateway to lightweight L1 static regex mode.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Switched to L1 mode

  /admin/guards/models/{id}/policy:
    post:
      summary: Configure Threat Policy for Model
      description: Sets default action (hitl/block) and critical destructive tools for threat verdicts.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_action: { type: string, enum: [hitl, block] }
                critical_tools: { type: array, items: { type: string } }
      responses:
        '200':
          description: Threat policy updated

  /admin/guards/hitl/pending:
    get:
      summary: List Pending HITL Approvals
      description: Lists all in-flight human approval requests awaiting operator decision.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Pending approvals list

  /admin/guards/hitl/respond:
    post:
      summary: Submit HITL Approval Decision
      description: Resolves a pending HITL request, approving or blocking the tool execution.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [call_id, approved]
              properties:
                call_id: { type: string }
                approved: { type: boolean }
      responses:
        '200':
          description: Decision resolved
        '404':
          description: Call ID not found or already resolved

  # ============================================================================
  # Policy Packs & DLP Governance Endpoints (Port 19415)
  # ============================================================================
  /admin/dlp/rules:
    get:
      summary: List DLP Pattern Rules
      description: Lists all built-in and custom DLP pattern rules.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of DLP rules
    post:
      summary: Create Custom DLP Rule
      description: Creates a new regular expression pattern rule.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '201':
          description: Rule created successfully

  /admin/policy-packs:
    get:
      summary: List Policy Packs
      description: Lists predefined and enterprise policy packs bundling related security rules.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of policy packs

  /admin/policies/preview:
    post:
      summary: Stateless Policy Preview Compilation
      description: Simulates policy compilation and effective rule resolution for an agent configuration without saving to disk.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Compiled policy preview

  /admin/agents/{name}/dlp:
    get:
      summary: Get Agent DLP Governance Configuration
      description: Retrieves the agent's DLP pack assignments, overrides, and effective compiled rules.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent DLP configuration
    put:
      summary: Update Agent DLP Governance Configuration
      description: Atomically updates and compiles agent DLP rules, snapshotting prior state.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saved and compiled successfully

  /admin/agents/{name}/export:
    post:
      summary: Direct Native MCP Export for a Security Profile
      description: Serializes the profile's attached Tool Sources into a Target Client's native MCP JSON format with dynamic secret placeholders and Selected Tools degradation warnings.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportNativeMCPRequest'
      responses:
        '200':
          description: Exported native MCP configuration
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportNativeMCPResponse'
        '400':
          description: Invalid profile name, target client, scope, or client_os
        '404':
          description: Security profile not found

  /api/reload:
    post:
      summary: Hot Reload Gateway Configuration
      description: Reloads YAML configuration and agent manifests from disk into memory without restarting the process.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Gateway reloaded successfully

  # ============================================================================
  # Ingress Proxy Endpoints (Port 19410)
  # ============================================================================
  /sse:
    get:
      summary: MCP Client SSE Ingress Stream
      description: Establishes a persistent Server-Sent Events stream for AI agents (Cursor, Claude Code, Copilot).
      security:
        - BearerAuth: []
      parameters:
        - name: agent
          in: query
          description: Optional target agent domain
          schema: { type: string }
      responses:
        '200':
          description: SSE connection established
        '401':
          description: Fail-closed unauthorized (missing or invalid Bearer token)

  /message:
    post:
      summary: MCP JSON-RPC Message Ingress
      description: Ingests client JSON-RPC 2.0 requests, passes them through the security filter pipeline, and proxies to upstream tools.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: Filtered JSON-RPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '401':
          description: Unauthorized

  /mcp:
    post:
      summary: Direct MCP JSON-RPC Ingress
      description: Direct POST transport alternative to /message for single-request JSON-RPC interactions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: Filtered JSON-RPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Standard API Key token (e.g., faw_live_...) provided via Authorization header.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative API Key delivery via X-API-Key header.

  schemas:
    DashboardStatusResponse:
      type: object
      properties:
        status: { type: string, example: "Ready" }
        gateway_id: { type: string, example: "farad-ai-gw-01" }
        transport_mode: { type: string, enum: [sse, stdio], example: "sse" }
        ingress_host: { type: string, example: "127.0.0.1" }
        ingress_port: { type: integer, example: 19410 }
        ingress_url: { type: string, example: "http://127.0.0.1:19410" }
        has_local_overrides: { type: boolean }
        guard_tier: { type: string, example: "disabled" }
        guard_model: { type: string, example: "L1 Static Rules (Fallback)" }
        guard_endpoint: { type: string, example: "In-Memory Precompiled Regex" }
        guard_latency_ms: { type: number, example: 0.2 }
        guard_status:
          type: object
          properties:
            tier: { type: string }
            custom_url: { type: string }
            model: { type: string }
            active: { type: boolean }
        active_filters:
          type: array
          items: { type: string }
          example: ["prefill_block", "schema_validation", "dlp", "rate_limiting"]
        config:
          type: object
          properties:
            prefill_block: { type: boolean }
            schema_validation: { type: boolean }
            guard: { type: boolean }
            dlp: { type: boolean }
            hitl: { type: boolean }
            loop_protection: { type: boolean }
            rate_limiting: { type: boolean }

    AuditLogsResponse:
      type: object
      properties:
        enabled: { type: boolean, example: true }
        total: { type: integer, example: 1 }
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        error: { type: string }

    AuditRecord:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        trace_id: { type: string, example: "trc-a1b2c3d4" }
        agent_name: { type: string, example: "antigravity" }
        release_version: { type: string }
        tool_name: { type: string, example: "fetch_customer_record" }
        caller_role: { type: string, example: "default" }
        decision: { type: string, enum: [PENDING, ALLOWED, AUDIT, MASKED, ERROR, BLOCKED, CRITICAL], example: "MASKED" }
        request_decision: { type: string, enum: [PENDING, ALLOWED, AUDIT, MASKED, ERROR, BLOCKED, CRITICAL] }
        response_decision: { type: string, enum: [PENDING, ALLOWED, AUDIT, MASKED, ERROR, BLOCKED, CRITICAL] }
        matched_rule: { type: string, example: "dlp" }
        error_message: { type: string }
        latency_ms: { type: number, example: 4.2 }
        input_size_bytes: { type: integer }
        output_size_bytes: { type: integer }
        raw_payload_preview: { type: string }
        original_payload_preview: { type: string }
        original_request: { type: string }
        request: { type: string }
        original_response: { type: string }
        response: { type: string }
        integrity_hash: { type: string }

    AuditEvent:
      $ref: '#/components/schemas/AuditRecord'

    FilterEnforcementOverride:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [enforce, audit, off]
          default: enforce

    AgentPayload:
      type: object
      properties:
        agent_name: { type: string, example: "antigravity" }
        description: { type: string }
        routing_mode: { type: string, enum: [aggregated, direct], default: aggregated }
        protocol_ids:
          type: array
          items: { type: string }
        clear_all_protocols: { type: boolean }
        enabled_tools:
          type: array
          items: { type: string }
        tool_governance:
          type: object
          additionalProperties:
            type: string
            enum: [autonomous, guarded_block, guarded_hitl, strict_always_hitl]
        restore_retained_protocols:
          type: array
          items: { type: string }
        rate_limit:
          type: object
          properties:
            max_burst: { type: integer }
            refill_rate: { type: number }
        loop_protection:
          type: object
          properties:
            max_repeat: { type: integer }
            window_seconds: { type: integer }
            exclude_tools:
              type: array
              items: { type: string }
        schema_validation:
          $ref: '#/components/schemas/FilterEnforcementOverride'
        guard:
          $ref: '#/components/schemas/FilterEnforcementOverride'

    MCPTool:
      type: object
      required: [name, description]
      properties:
        name: { type: string, example: "query_database" }
        description: { type: string, example: "Executes read-only SQL queries" }
        inputSchema: { type: object }

    AgentSummary:
      type: object
      required: [name, routing_mode]
      properties:
        name: { type: string, example: "finance-agent" }
        routing_mode: { type: string, enum: [aggregated, direct], example: "aggregated" }
        config:
          $ref: '#/components/schemas/AgentPayload'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        effective_tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPTool'
        status: { type: string, example: "active" }

    KeySummaryResponse:
      type: object
      required: [id, prefix, name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, example: "faw_live_a1b2..." }
        name: { type: string, example: "ci-pipeline" }
        role: { type: string, enum: [Admin, Agent, Viewer], example: "Agent" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    CreateKeyResponse:
      type: object
      required: [id, key, name, role]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: "faw_live_7c3a9f1b2e8d4a6c..." }
        name: { type: string, example: "ci-pipeline" }
        role: { type: string, enum: [Admin, Agent, Viewer], example: "Agent" }
        warning: { type: string, example: "Save this key now. It cannot be retrieved again." }

    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, example: "2.0" }
        id: { oneOf: [{ type: string }, { type: integer }, { type: "null" }] }
        method: { type: string, example: "tools/call" }
        params: { type: object }
        meta: { type: object, description: "Trace headers and client metadata" }

    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, example: "2.0" }
        id: { oneOf: [{ type: string }, { type: integer }, { type: "null" }] }
        result: { type: object }
        error:
          $ref: '#/components/schemas/JSONRPCError'

    JSONRPCError:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: -32004 }
        message: { type: string, example: "DLP policy violation: sensitive data blocked" }
        data: { type: object }

    ExportNativeMCPRequest:
      type: object
      required: [client]
      properties:
        client:
          type: string
          enum: [claude-code, claude-desktop, cursor, cursor-workspace, windsurf, cline, roo-code, antigravity, generic]
        scope:
          type: string
          enum: [global, project]
        client_os:
          type: string
          enum: [darwin, linux, windows]

    ExportWarning:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [warning, info] }
        server: { type: string }
        message: { type: string }

    ExportCompanionFile:
      type: object
      required: [path_hint, merge_hazard, content]
      properties:
        path_hint: { type: string }
        merge_hazard: { type: boolean }
        content: { type: object }

    ExportNativeMCPResponse:
      type: object
      required: [client, scope, target_path_hint, merge_hazard, config, warnings]
      properties:
        client: { type: string }
        scope: { type: string }
        target_path_hint: { type: string }
        merge_hazard: { type: boolean }
        config: { type: object }
        companion_files:
          type: array
          items:
            $ref: '#/components/schemas/ExportCompanionFile'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ExportWarning'
